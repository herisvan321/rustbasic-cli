[package]
name = "rustbasic-cli"
version = "0.0.22"
edition = "2024"
description = "CLI tool for the RustBasic Framework."
license = "MIT"
readme = "README.md"
homepage = "https://github.com/herisvan321/rustbasic"
repository = "https://github.com/herisvan321/rustbasic"
documentation = "https://github.com/herisvan321/rustbasic"
keywords = ["rustbasic", "framework", "cli", "scaffolding", "sqlx"]
categories = ["development-tools", "command-line-utilities", "web-programming"]

[dependencies]
tokio = { version = "1.52.1", features = ["full"] }
colored = "3.0"
dotenvy = "0.15.7"
chrono = { version = "0.4.39", features = ["serde"] }
sqlx = { version = "0.8", features = ["any", "sqlite", "mysql", "runtime-tokio", "tls-rustls"], default-features = false }
rustbasic-core = "0.1"
regex = "1.10"
rand = "0.10.1"
base64 = "0.22.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "rustbasic"
path = "src/main.rs"



